name: Restore and publish portfolio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest portfolio source from archived release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download archive-2026-09-28 --repo "${{ github.repository }}" --pattern portfolio-current.zip --dir "$RUNNER_TEMP"
          unzip -q -o "$RUNNER_TEMP/portfolio-current.zip" -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build
        run: |
          node --check portfolio.js
          node --check preview.cjs
          node --check build-site.cjs
          node build-site.cjs
      - name: Save restored source in GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!dist'
          if ! git diff --cached --quiet; then
            git commit -m "Restore latest portfolio source from release archive"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

